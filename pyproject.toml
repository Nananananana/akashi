[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akashi"
version = "0.1.0.dev0"
description = "Local-first response auditing for generative AI. Separate what an answer took from its evidence from what it made up, deterministically, and say which is which."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Nananananana" }]
keywords = ["audit", "grounding", "hallucination", "attribution", "rag", "provenance", "llm", "local-first", "japanese"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Natural Language :: Japanese",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]

# Zero. Not "few". See docs/adr/0001-the-domain-depends-on-nothing.md -- an
# auditor is the component a regulated buyer is asked to trust, and every
# runtime dependency is a third party they did not agree to trust.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "hypothesis>=6.90",
    "ruff>=0.16",
    "mypy>=1.10",
    "import-linter>=2",
    "pre-commit",
    # Validates real reports against the published contract. There is no
    # pydantic in the core (ADR-0001), so the schema and the dataclasses are
    # kept in step by a test rather than derived from one another.
    "jsonschema>=4",
    # Reads the CI and hook configuration structurally rather than by matching
    # strings, so a guard cannot pass by finding its own explanation in a
    # comment. It arrives with pre-commit anyway; declared because a test that
    # depends on a transitive dependency breaks the day that dependency moves.
    "pyyaml>=6",
    # mypy now reads the tests too, and an untyped `jsonschema` there is a
    # silent `Any` in the checks that validate the published contract.
    "types-jsonschema",
    "types-PyYAML",
]

# There is deliberately no `siblings` extra, and the reason is stronger than it
# was first written. The seam tests it would exist for -- ADR-0008's restorer
# against the real `mamori`, ADR-0007's contract against the reference producer
# -- land in v0.5, and neither project is on an index, so a plain requirement
# would be unresolvable.
#
# A direct reference would resolve, and that is the trap. `mamori @
# git+https://...` installs correctly and beats a taken PyPI name, because no
# index is consulted. But an extra is metadata: it reaches the built
# distribution as `Requires-Dist: mamori @ git+... ; extra == 'siblings'`, and
# PyPI refuses any distribution whose metadata carries a direct reference. One
# line in an extra nobody installs makes the *whole* distribution unpublishable.
#
# Checked rather than believed: hatchling refuses to build this at all without
# `tool.hatch.metadata.allow-direct-references`, which is a local signal other
# backends do not give. Setting that flag builds cleanly and puts the line in
# METADATA exactly as above. So the guard here is a build error today and a
# rejected upload the moment somebody switches the flag on to make the error go
# away.
#
# Where it belongs is the install step of a CI job, which never touches
# metadata. Until then those tests install their siblings from source, and the
# architecture tests assert that nothing under src/ imports either one.

[project.urls]
Homepage = "https://github.com/Nananananana/akashi"
Repository = "https://github.com/Nananananana/akashi"
Issues = "https://github.com/Nananananana/akashi/issues"
Changelog = "https://github.com/Nananananana/akashi/blob/main/CHANGELOG.md"

[project.scripts]
akashi = "akashi.interfaces.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/akashi"]

# The contract ships inside the wheel: a consumer validating a report should
# not have to fetch a schema from the internet, and an auditor whose schema
# lives on someone else's server is not an auditor.
[tool.pytest.ini_options]
testpaths = ["tests"]
# Network tests are deselected by default. akashi audits offline by design and
# so must its test suite: a check that cannot run on a developer's machine, or
# inside the networks that most need this tool, is a check that gets disabled.
# The one job that runs them asks for them by name.
addopts = "-q -m 'not network'"
markers = [
    "network: reaches a host outside this machine. Deselected by default; run with -m network",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "S", "RUF"]
ignore = [
    "S101",   # assert: this is a test suite convention
    # Full-width and CJK characters are the subject matter, not a typo. The
    # segmenter and the particular extractor exist because a Japanese digit
    # can be written four ways and a Chinese sentence ends in a character that
    # is not a full stop. Both forms appear in code, docstrings and fixtures
    # on purpose. See ADR-0009.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]

[tool.mypy]
python_version = "3.12"
# The scope of a check has to match the scope of what it protects. This said
# `src/akashi` and so looked at 53 of the repository's 86 files, leaving the
# corpus generator and every test unchecked -- including the ones the published
# measurements rest on. Widening it found an assertion that could not fail.
#
# One profile for all of it, rather than a relaxed one for tests. The first
# attempt at that used `module = "test_*"`, which mypy rejects as a pattern and
# then continues past, applying nothing: the same shape as the narrow scope it
# was meant to soften.
files = ["src/akashi", "tests", "tools"]
strict = true
warn_unreachable = true

[tool.coverage.run]
source = ["src/akashi"]
