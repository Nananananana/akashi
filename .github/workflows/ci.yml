name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest --cov=akashi --cov-report=term-missing
        env:
          PYTHONUTF8: "1"

      # A generated case that is broken fails a *correct* implementation, so
      # the oracle is checked as often as the code it is checking. Without
      # this, a bad fixture looks exactly like a regression.
      - name: Check the evaluation fixtures
        run: python tools/generate_cases.py --check-only
        env:
          PYTHONUTF8: "1"

      # The labelled corpus and the hand-marked answers, against floors set
      # deliberately below what was measured. Floors, not targets: a gate at
      # today's number makes every honest experiment a build failure, and
      # src/akashi/evaluation/floors.py prints each bound beside the score it
      # was set against so the gap stays visible.
      - name: Evaluate
        run: python -m akashi.interfaces.cli.main eval --tier ci --gate
        env:
          PYTHONUTF8: "1"

  lint:
    name: lint, types and layering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check . && python -m ruff format --check .

      - name: Types
        run: python -m mypy

      # The layering is a gate, not a guideline. ADR-0001.
      - name: Layering
        run: lint-imports

  dependencies:
    name: the dependency count is zero
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The README promises zero runtime dependencies -- "an auditor with a
      # supply chain is not an auditor". A promise in a README decays; this one
      # is checked on every push, because the number that says so has to be
      # measured rather than asserted.
      #
      # It used to say the README promises `pip install akashi`. It does not,
      # and it could not: that name on PyPI belongs to an unrelated project.
      # What akashi is published as is undecided and is a decision about the
      # product, not about this job.
      - name: Install with no extras
        run: python -m pip install --upgrade pip && python -m pip install .

      # ADR-0002 promises the contract ships inside the wheel, and pyproject
      # says how. Both of those are declarations, and the test suite can only
      # compare one declaration to the other -- `force-include` does not apply
      # to an editable install, so a developer's tree never has the file at
      # that path and a local test would fail for everybody.
      #
      # This job is the one place a real install exists, so this is the one
      # place the artefact gets opened. It is opened the way a consumer opens
      # it, through importlib.resources against the installed package, rather
      # than by unzipping something we just built: a wheel that contains the
      # file but puts it where nobody looks would pass the second check and
      # fail this one.
      - name: The contract is inside what was installed
        run: |
          python - <<'PY'
          import json
          from importlib.resources import files

          shipped = files("akashi") / "schemas" / "audit-report-1.json"
          body = json.loads(shipped.read_text(encoding="utf-8"))
          assert body["$id"].endswith("audit-report-1.json"), body.get("$id")
          print("shipped:", shipped)
          PY

      - name: Assert nothing came with it
        run: |
          python - <<'PY'
          import importlib.metadata as md
          installed = {d.metadata["Name"].lower() for d in md.distributions()}
          # pip and its own bootstrap packaging are part of the environment,
          # not of akashi.
          allowed = {"akashi", "pip", "setuptools", "wheel", "packaging"}
          extra = sorted(installed - allowed)
          assert not extra, f"akashi pulled in runtime dependencies: {extra}"
          print("runtime dependencies:", len(extra))
          PY
