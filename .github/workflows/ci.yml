name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest --cov=akashi --cov-report=term-missing
        env:
          PYTHONUTF8: "1"

      # A generated case that is broken fails a *correct* implementation, so
      # the oracle is checked as often as the code it is checking. Without
      # this, a bad fixture looks exactly like a regression.
      - name: Check the evaluation fixtures
        run: python tools/generate_cases.py --check-only
        env:
          PYTHONUTF8: "1"

      # The seam with tsumugi, through the installed entry point. Every other
      # test in this repository reads a package somebody here typed, which
      # proves akashi is self-consistent and nothing more. ADR-0007 has akashi
      # reading somebody else's contract without importing them, and this is
      # where the two implementations are put in front of each other.
      - name: The seam with tsumugi
        run: python -m pytest tests/test_seam_tsumugi.py -v
        env:
          PYTHONUTF8: "1"

      # The labelled corpus and the hand-marked answers, against floors set
      # deliberately below what was measured. Floors, not targets: a gate at
      # today's number makes every honest experiment a build failure, and
      # src/akashi/evaluation/floors.py prints each bound beside the score it
      # was set against so the gap stays visible.
      - name: Evaluate
        run: python -m akashi.interfaces.cli.main eval --tier ci --gate
        env:
          PYTHONUTF8: "1"

  lint:
    name: lint, types and layering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      # Every hook, over every file. `.pre-commit-config.yaml` had eleven and
      # CI ran two of them -- the other nine existed only on a developer's
      # machine, and only if that developer had installed pre-commit. Among
      # them `check-yaml`, which is the one that matters most here: an invalid
      # workflow file is not an error anybody is shown, it is a workflow that
      # quietly does not run.
      #
      # This replaces the explicit `ruff check . && ruff format --check .`
      # rather than joining it. Two definitions of the same check drift, and
      # the narrower one runs first and says nothing -- which makes the wider
      # one look capricious. The hook config pins an exact ruff and reads the
      # same `pyproject.toml` rules, so nothing about the linting changed
      # except how many of the checks beside it are enforced.
      - name: Hooks
        run: python -m pre_commit run --all-files --show-diff-on-failure

      # Reads `files` from pyproject, which now names src, tests and tools.
      # It said `src/akashi` and checked 53 of 86 files, and the corpus
      # generator and every test were outside it.
      - name: Types
        run: python -m mypy

      # The layering is a gate, not a guideline. ADR-0001.
      - name: Layering
        run: lint-imports

  dependencies:
    name: the dependency count is zero
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The README promises zero runtime dependencies -- "an auditor with a
      # supply chain is not an auditor". A promise in a README decays; this one
      # is checked on every push, because the number that says so has to be
      # measured rather than asserted.
      #
      # It used to say the README promises `pip install akashi`. It does not,
      # and it could not: that name on PyPI belongs to an unrelated project.
      # What akashi is published as is undecided and is a decision about the
      # product, not about this job.
      - name: Install with no extras
        run: python -m pip install --upgrade pip && python -m pip install .

      # ADR-0002 promises the contract ships inside the wheel, and pyproject
      # says how. Both of those are declarations, and the test suite can only
      # compare one declaration to the other -- `force-include` does not apply
      # to an editable install, so a developer's tree never has the file at
      # that path and a local test would fail for everybody.
      #
      # This job is the one place a real install exists, so this is the one
      # place the artefact gets opened. It is opened the way a consumer opens
      # it, through importlib.resources against the installed package, rather
      # than by unzipping something we just built: a wheel that contains the
      # file but puts it where nobody looks would pass the second check and
      # fail this one.
      - name: The contract is inside what was installed
        run: |
          python - <<'PY'
          import json
          from importlib.resources import files

          shipped = files("akashi") / "schemas" / "audit-report-1.json"
          body = json.loads(shipped.read_text(encoding="utf-8"))
          assert body["$id"].endswith("audit-report-1.json"), body.get("$id")
          print("shipped:", shipped)
          PY

      - name: Assert nothing came with it
        run: |
          python - <<'PY'
          import importlib.metadata as md
          installed = {d.metadata["Name"].lower() for d in md.distributions()}
          # pip and its own bootstrap packaging are part of the environment,
          # not of akashi.
          allowed = {"akashi", "pip", "setuptools", "wheel", "packaging"}
          extra = sorted(installed - allowed)
          assert not extra, f"akashi pulled in runtime dependencies: {extra}"
          print("runtime dependencies:", len(extra))
          PY

      # The command whose whole subject is the machine it is run on, run on a
      # machine nobody set up for it. It exits non-zero when something akashi
      # promised to ship is absent, so this is the check that the contract
      # reaches a real install *and* that the reader of it works -- one step
      # covering both halves of #57.
      - name: doctor agrees the installation is sound
        run: |
          akashi doctor

      # ADR-0017 put an HTTP client behind an extra. This is the check that it
      # stayed behind it: importing akashi, the CLI, and the adapters package
      # must not load a network stack on a machine that has the extra -- and
      # `adapters/__init__` deliberately does not re-export the judge, which is
      # what makes that true rather than hoped for.
      - name: Importing akashi reaches no network stack
        run: |
          pip install "anthropic>=0.40"
          python - <<'PY'
          import sys
          import akashi, akashi.interfaces.cli.main, akashi.infrastructure.adapters

          for name in ("anthropic", "socket", "ssl", "httpx", "httpcore"):
              assert name not in sys.modules, f"importing akashi pulled in {name}"
          print("nothing networked was imported")
          PY

  # The seam against the real redactor (#59). Four ways this job could be green
  # and prove nothing, three of them observed in sibling repositories:
  #
  #   1. `mamori` is on no index, and the name is free there. It comes in by
  #      direct git reference -- in a STEP, never in pyproject.toml: an extra
  #      reaches the built distribution as `Requires-Dist: ... @ git+...`, and
  #      PyPI refuses any distribution whose metadata carries one. A line in an
  #      extra nobody installs would make the whole distribution unpublishable.
  #   2. `import mamori` proves a module of that name exists, not that it is
  #      ours. PEP 610's direct_url.json is checked before anything runs.
  #   3. `continue-on-error` goes on a STEP, never on the job. Observed in
  #      tsumugi: a job-level one swallowed an install failure and the job had
  #      never run once. A setup failure must be red, and it is a different
  #      finding from "the seam failed".
  #   4. No importorskip in the seam test. Verified in a sibling: pytest against
  #      a venv without the library exits 0, green, with zero seam tests run.
  #      Here the file imports it at the top, so absence is an error -- and
  #      `-m siblings` collecting nothing exits 5, so an empty selection is red
  #      too.
  seam-mamori:
    name: the seam against the real redactor
    runs-on: ubuntu-latest
    env:
      AKASHI_SEAM_MAMORI: "1"
      AKASHI_SEAM_MAMORI_REF: "0b7da4cf979785db9290d8533e4cae5cd9cdbec8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install akashi and its test tooling
        run: pip install -e ".[dev]"

      - name: Install the sibling by pinned direct reference
        run: |
          pip install "mamori @ git+https://github.com/Nananananana/mamori.git@$AKASHI_SEAM_MAMORI_REF"

      # The one place this file can be type-checked, and the reason it is
      # excluded from the ordinary mypy run rather than silenced with
      # ignore_missing_imports: that would check the seam against `Any`, which
      # agrees with every reading of the sibling -- the thing this exists not to
      # do. mypy reads a file named on the command line even when `exclude`
      # would have skipped it.
      - name: Type-check the seam where its subject exists
        run: |
          python -m mypy tests/test_seam_mamori.py

      - name: Run the seam
        run: |
          python -m pytest -m siblings
